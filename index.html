<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Flashcard Kanji N5 Lucu! ✨</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary-color: #ff6b81;
      --secondary-color: #70a1ff;
      --accent-yellow: #fffa65;
      --text-color: #2f3542;
      --photo-url: url('https://demonviscount-creator.github.io/Quiz-Mamas/mamas.jpg');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-image: linear-gradient(rgba(255, 240, 243, 0.7), rgba(255, 240, 243, 0.7)), var(--photo-url);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(255, 107, 129, 0.3);
      width: 100%;
      max-width: 480px;
      padding: 25px;
      text-align: center;
      border: 4px solid #fff;
    }

    .profile-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .profile-photo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary-color);
    }

    h1 {
      color: var(--primary-color);
      font-size: 22px;
      text-shadow: 1px 1px 0px #fff;
    }

    /* Tabs */
    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #ffeaa7;
      color: #d63031;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: white;
      box-shadow: 0 4px 10px rgba(255, 107, 129, 0.4);
    }

    /* Flashcard Flip Effect */
    .flashcard-section {
      display: block;
    }

    .card-scene {
      width: 100%;
      height: 260px;
      perspective: 1000px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 25px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border: 3px dashed #ff758c;
    }

    .card-front {
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      color: #2c3e50;
    }

    .card-back {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      color: #d63031;
      transform: rotateY(180deg);
    }

    .kanji-big {
      font-size: 90px;
      font-weight: bold;
      text-shadow: 2px 2px 5px rgba(255,255,255,0.8);
      margin-bottom: 5px;
    }

    .hint-text {
      font-size: 13px;
      color: #57606f;
      background: rgba(255, 255, 255, 0.6);
      padding: 4px 12px;
      border-radius: 10px;
    }

    .kanji-detail {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .kanji-reading {
      font-size: 16px;
      color: #2f3542;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 15px;
      border-radius: 12px;
      width: 90%;
      line-height: 1.5;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .ctrl-btn {
      background: var(--secondary-color);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
    }

    .ctrl-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    /* Quiz Mode */
    .quiz-section {
      display: none;
    }

    .quiz-card {
      background: #fff0f3;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid #ffccd5;
    }

    .quiz-kanji {
      font-size: 65px;
      font-weight: bold;
      color: var(--primary-color);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .opt-btn {
      background: #ffffff;
      border: 2px solid #70a1ff;
      padding: 12px;
      border-radius: 15px;
      font-size: 15px;
      font-weight: bold;
      color: #2f3542;
      cursor: pointer;
      text-align: left;
    }

    .opt-btn.correct { background: #7bed9f; border-color: #2ed573; color: #2ed573; }
    .opt-btn.wrong { background: #ff7875; border-color: #ff4d4f; color: white; }

    .score-badge {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-color);
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="profile-header">
      <img src="https://demonviscount-creator.github.io/Quiz-Mamas/mamas.jpg" class="profile-photo" alt="Mamas">
      <h1>Kanji N5 Lucu ♥️</h1>
    </div>

    <!-- Mode Tabs -->
    <div class="tab-nav">
      <button class="tab-btn active" id="tab-card" onclick="switchTab('card')">🎴 Flashcard (Bolak-Balik)</button>
      <button class="tab-btn" id="tab-quiz" onclick="switchTab('quiz')">✍️ Tes Tebak Kanji</button>
    </div>

    <!-- MODE 1: FLASHCARD -->
    <div id="flashcard-section" class="flashcard-section">
      <div class="card-scene" onclick="flipCard()">
        <div class="card-inner" id="card-inner">
          <div class="card-face card-front">
            <div class="kanji-big" id="card-kanji">日</div>
            <div class="hint-text">👆 Tap / Klik untuk balik kartu!</div>
          </div>
          <div class="card-face card-back">
            <div class="kanji-detail" id="card-meaning">Matahari / Hari</div>
            <div class="kanji-reading" id="card-reading">
              <strong>Onyomi:</strong> NICHI, JITSU<br>
              <strong>Kunyomi:</strong> hi, -bi, ka
            </div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" onclick="prevCard()">⬅️ Sebelum</button>
        <button class="ctrl-btn" style="background:#ff758c;" onclick="randomCard()">🎲 Acak</button>
        <button class="ctrl-btn" onclick="nextCard()">Lanjut ➡️</button>
      </div>
      <div style="margin-top: 15px; font-size: 13px; color: #888;" id="card-index">Kartu 1 dari 20</div>
    </div>

    <!-- MODE 2: TEBAK KANJI QUIZ -->
    <div id="quiz-section" class="quiz-section">
      <div class="quiz-card">
        <div style="font-size: 12px; color: #aaa;" id="quiz-progress">Soal 1 dari 20</div>
        <div class="quiz-kanji" id="quiz-kanji">日</div>
        <div style="font-size: 14px; color: #666;">Apa arti / cara baca Kanji ini?</div>
      </div>

      <div class="options-grid" id="options-container"></div>
      <div class="score-badge" id="quiz-score" style="display:none;"></div>
    </div>
  </div>

  <script>
    const kanjiList = [
      { kanji: "日", meaning: "Matahari / Hari", on: "NICHI, JITSU", kun: "hi, -bi, ka" },
      { kanji: "月", meaning: "Bulan", on: "GETSU, GATSU", kun: "tsuki" },
      { kanji: "木", meaning: "Pohon / Kayu", on: "MOKU, BOKU", kun: "ki" },
      { kanji: "山", meaning: "Gunung", on: "SAN", kun: "yama" },
      { kanji: "川", meaning: "Sungai", on: "SEN", kun: "kawa" },
      { kanji: "田", meaning: "Sawah", on: "DEN", kun: "ta" },
      { kanji: "人", meaning: "Orang", on: "JIN, NIN", kun: "hito" },
      { kanji: "口", meaning: "Mulut", on: "KOU", kun: "kuchi" },
      { kanji: "車", meaning: "Mobil / Roda", on: "SHA", kun: "kuruma" },
      { kanji: "門", meaning: "Gerbang", on: "MON", kun: "kado" },
      { kanji: "火", meaning: "Api", on: "KA", kun: "hi" },
      { kanji: "水", meaning: "Air", on: "SUI", kun: "mizu" },
      { kanji: "金", meaning: "Emas / Uang", on: "KIN", kun: "kane" },
      { kanji: "土", meaning: "Tanah", on: "TO, DO", kun: "tsuchi" },
      { kanji: "子", meaning: "Anak", on: "SHI, SU", kun: "ko" },
      { kanji: "女", meaning: "Wanita", on: "JO", kun: "onna" },
      { kanji: "学", meaning: "Belajar", on: "GAKU", kun: "mana(bu)" },
      { kanji: "生", meaning: "Hidup / Lahir", on: "SEI, SHO", kun: "i(kiru), u(mareru)" },
      { kanji: "先", meaning: "Dahulu / Dulu", on: "SEN", kun: "saki" },
      { kanji: "私", meaning: "Saya / Aku", on: "SHI", kun: "watashi" }
    ];

    let currentCardIndex = 0;
    let quizIndex = 0;
    let score = 0;
    let canAnswer = true;
    let shuffledQuiz = [];

    // Flashcard Functions
    function updateCard() {
      const card = kanjiList[currentCardIndex];
      document.getElementById('card-kanji').innerText = card.kanji;
      document.getElementById('card-meaning').innerText = card.meaning;
      document.getElementById('card-reading').innerHTML = `<strong>Onyomi:</strong> ${card.on}<br><strong>Kunyomi:</strong> ${card.kun}`;
      document.getElementById('card-index').innerText = `Kartu ${currentCardIndex + 1} dari ${kanjiList.length}`;
      document.getElementById('card-inner').classList.remove('is-flipped');
    }

    function flipCard() {
      document.getElementById('card-inner').classList.toggle('is-flipped');
    }

    function nextCard() {
      currentCardIndex = (currentCardIndex + 1) % kanjiList.length;
      updateCard();
    }

    function prevCard() {
      currentCardIndex = (currentCardIndex - 1 + kanjiList.length) % kanjiList.length;
      updateCard();
    }

    function randomCard() {
      currentCardIndex = Math.floor(Math.random() * kanjiList.length);
      updateCard();
    }

    // Switch Tab
    function switchTab(tab) {
      if (tab === 'card') {
        document.getElementById('flashcard-section').style.display = 'block';
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('tab-card').classList.add('active');
        document.getElementById('tab-quiz').classList.remove('active');
      } else {
        document.getElementById('flashcard-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'block';
        document.getElementById('tab-quiz').classList.add('active');
        document.getElementById('tab-card').classList.remove('active');
        startQuiz();
      }
    }

    // Quiz Functions
    function startQuiz() {
      shuffledQuiz = [...kanjiList].sort(() => 0.5 - Math.random());
      quizIndex = 0;
      score = 0;
      document.getElementById('quiz-score').style.display = 'none';
      loadQuizQuestion();
    }

    function loadQuizQuestion() {
      canAnswer = true;
      const q = shuffledQuiz[quizIndex];
      document.getElementById('quiz-progress').innerText = `Soal ${quizIndex + 1} dari ${shuffledQuiz.length}`;
      document.getElementById('quiz-kanji').innerText = q.kanji;

      const wrongOpts = kanjiList.filter(k => k.kanji !== q.kanji).sort(() => 0.5 - Math.random()).slice(0, 3);
      const options = [q, ...wrongOpts].sort(() => 0.5 - Math.random());

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = `${opt.meaning} (${opt.kun})`;
        btn.onclick = () => selectQuizOption(opt.kanji === q.kanji, btn);
        container.appendChild(btn);
      });
    }

    function selectQuizOption(isCorrect, btn) {
      if (!canAnswer) return;
      canAnswer = false;

      if (isCorrect) {
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('wrong');
      }

      setTimeout(() => {
        quizIndex++;
        if (quizIndex < shuffledQuiz.length) {
          loadQuizQuestion();
        } else {
          document.getElementById('options-container').innerHTML = '';
          const scoreBadge = document.getElementById('quiz-score');
          scoreBadge.style.display = 'block';
          scoreBadge.innerHTML = `🎉 Selesai!<br>Skor Mamas: <strong>${score} / ${shuffledQuiz.length}</strong><br><br><button class="ctrl-btn" onclick="startQuiz()">Coba Lagi ❤️</button>`;
        }
      }, 1000);
    }

    // Init
    updateCard();
  </script>
</body>
</html>
